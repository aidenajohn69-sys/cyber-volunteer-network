    /* Frutiger Aero / Aqua Liquid Glass Core Aesthetics */

    /* Floating Liquid Ambient Background Orbs */
    .liquid-orb-1 {
      position: fixed;
      top: -10%;
      left: 10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, rgba(0, 112, 243, 0.1) 50%, transparent 70%);

      pointer-events: none;
      z-index: 0;
      animation: floatOrb 20s ease-in-out infinite alternate;
    }

    .liquid-orb-2 {
      position: fixed;
      bottom: -15%;
      right: 5%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.16) 0%, rgba(0, 200, 255, 0.08) 50%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 25s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -50px) scale(1.12); }
      100% { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* Glossy Glass Container Panels */
    .aqua-glass-panel {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.65),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.6),
        0 20px 45px rgba(0, 10, 30, 0.8),
        0 0 25px rgba(0, 240, 255, 0.12);
      border-radius: 24px;
    }

    /* Beveled Aqua Glass Buttons */
    .aqua-glass-btn {
      background: linear-gradient(180deg, 
        rgba(255, 255, 255, 0.5) 0%, 
        rgba(255, 255, 255, 0.15) 45%, 
        rgba(0, 200, 255, 0.4) 50%, 
        rgba(0, 110, 230, 0.7) 100%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 
        inset 0 1px 1.5px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(0, 0, 0, 0.4),
        0 4px 18px rgba(0, 150, 255, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .aqua-glass-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      transform: skewX(-20deg);
      transition: all 0.6s ease;
    }

    .aqua-glass-btn:hover::before {
      left: 160%;
    }

    .aqua-glass-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 1),
        0 8px 28px rgba(0, 240, 255, 0.6);
    }

    .aqua-glass-btn:active {
      transform: translateY(1px);
    }

    /* Soft Translucent Secondary Buttons */
    .aqua-soft-btn {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(14px);
      transition: all 0.2s ease;
    }

    .aqua-soft-btn:hover {
      background: linear-gradient(180deg, rgba(0, 230, 255, 0.22) 0%, rgba(0, 110, 255, 0.15) 100%);
      border-color: rgba(0, 240, 255, 0.6);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(0, 220, 255, 0.35);
    }

    /* Navigation Active Tab Highlight */
    .aqua-tab-active {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(0, 190, 255, 0.5) 100%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.95), 0 4px 18px rgba(0, 190, 255, 0.45);
      color: #ffffff;
      font-weight: 700;
    }

    /* Custom Glass Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(2, 10, 25, 0.6);

      background: linear-gradient(180deg, #00f0ff, #0066ff);
      border-radius: 10px;
      box-shadow: inset 0 0 4px rgba(255,255,255,0.6);

    /* Audio Visualizer Animation */

      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

      animation: barWave 1s ease-in-out infinite;

  </style>

        fullContent: `EMAIL CORRESPONDENCE - SUNSHINE COMMUNITY CENTER PARTNER\nFrom: Dr. M. Nair (Director, Sunshine Community Center)\nTo: outreach@cybervolunteernetwork.org\nDate: April 19, 2026\n\nSubject: Re: Youth Mentorship Session Confirmation\n\nDear Cyber Volunteer Network Team,\n\nWe are delighted to host your student volunteers at Sunshine Community Center this coming Saturday for the youth literacy drive.\n\nAgreed Operational Details:\n- Date: Saturday\n- Session Time: 9:00 AM - 1:00 PM\n- Room Allocation: Main Hall & Seminar Room B\n- Security & Visitor Passes: Please email us the final volunteer headcount and full names by Thursday evening (6:00 PM) so our entry desk can print badges.`

        setToast({ title, message, type });
        setTimeout(() => setToast(null), 4500);
      };

      // Dynamic Conflict & Overwrite Engine
      const processNewKnowledgeRecord = (newRecord) => {
        const fullTxt = (newRecord.fullContent + " " + newRecord.excerpt).toLowerCase();
        let conflictsFound = [];

        if (fullTxt.includes("transport") || fullTxt.includes("bus") || fullTxt.includes("booking") || fullTxt.includes("checklist")) {
          setSources(prev => {
            return prev.map(src => {
              if (src.fileName.includes("Transport") && src.status === "Approved") {
                conflictsFound.push(src.fileName);
                return { ...src, status: "Outdated / Overwritten" };
              }
              return src;
            });
          });

          // Add to Audit Log
          const logEntry = {
            id: `log-${Date.now()}`,
            timestamp: new Date().toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
            title: "Dynamic Overwrite: Transport Rule Updated",
            overwrittenFile: conflictsFound.length > 0 ? conflictsFound.join(", ") : "Prior Transport Rules",
            newFile: newRecord.fileName,
            fieldChanged: "Operating Logistics & Confirmation Deadlines",
            reason: `Uploaded record '${newRecord.fileName}' introduced newer operational constraints.`
          };
          setAuditLogs(prev => [logEntry, ...prev]);
        }

        setSources(prev => [newRecord, ...prev]);

        if (conflictsFound.length > 0) {
          showToast(
            "Conflict Overwritten!",
            `New record '${newRecord.fileName}' contradicted earlier guidelines. Superseded ${conflictsFound.join(", ")}.`,
            "warning"
          );
        } else {
          showToast(
            "Record Vectorized & Indexed",

            };

              date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),

              excerpt: `Vector indexed PDF/DOC file: ${fileName}.`,

            if (e.data.size > 0) audioChunksRef.current.push(e.data);

                  </div>

                  {/* CHAT INPUT COMPOSER */}
                  <form onSubmit={(e) => { e.preventDefault(); const val = e.target.query.value; if(val){ handleSendMessage(val); e.target.query.value = ''; } }} className="mt-4 pt-3 border-t border-white/10 flex items-center space-x-2">
                    <input
                      name="query"
                      type="text"
                      placeholder="Ask about SOPs, partner rules, timelines, or voice transcripts..."
                      className="flex-1 bg-slate-950/80 border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400"
                    />
                    <button type="submit" className="p-3 rounded-xl aqua-glass-btn text-white">
                      <IconSend className="w-4 h-4" />
                    </button>
                  </form>

                </div>
              )}

              {/* CALENDAR TAB */}
              {activeTab === 'calendar' && (
                <div className="aqua-glass-panel p-6 space-y-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
                    <div>
                      <h2 className="text-lg font-black text-white flex items-center space-x-2">
                        <IconCalendar className="w-5 h-5 text-cyan-400" />
                        <span>Upcoming Operational Events & Deadlines</span>
                      </h2>
                      <p className="text-xs text-cyan-200/80 mt-0.5">
                        Synchronized automatically from active SOPs, partner approvals, and uploaded voice notes
                      </p>
                    </div>
                    <button
                      onClick={() => setShowAddEventModal(true)}
                      className="px-4 py-2 rounded-xl aqua-glass-btn text-xs font-bold text-white flex items-center space-x-1.5 self-start sm:self-auto"
                    >
                      <IconPlus className="w-4 h-4" />
                      <span>Add Calendar Event</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {events.map(evt => (
                      <div
                        key={evt.id}
                        onClick={() => setSelectedEventModal(evt)}
                        className="p-4 rounded-2xl bg-slate-950/60 border border-white/10 hover:border-cyan-400/50 hover:bg-cyan-950/20 transition-all cursor-pointer group space-y-3"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-mono font-bold text-cyan-300">{evt.date} • {evt.time}</span>
                          <span className={`px-2.5 py-0.5 rounded-md text-[10px] font-bold border ${
                            evt.priority === 'Critical' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                            evt.priority === 'High' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' :
                            'bg-indigo-500/20 text-indigo-300 border-indigo-500/40'
                          }`}>
                            {evt.category} • {evt.priority}
                          </span>
                        </div>
                        <h4 className="text-sm font-bold text-white group-hover:text-cyan-200 transition-colors">
                          {evt.title}
                        </h4>
                        <p className="text-xs text-slate-300 leading-relaxed line-clamp-2">
                          {evt.description}
                        </p>
                        <div className="pt-2 flex items-center justify-between text-[10px] text-cyan-400/90 font-semibold border-t border-white/5">
                          <span className="flex items-center space-x-1">
                            <IconFileText className="w-3.5 h-3.5" />
                            <span>Linked: {evt.linkedSource}</span>
                          </span>
                          <span className="text-slate-400 group-hover:text-cyan-300">View Details &rarr;</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* OVERWRITE AUDIT LOG TAB */}
              {activeTab === 'audit' && (
                <div className="aqua-glass-panel p-6 space-y-6">
                  <div>
                    <h2 className="text-lg font-black text-white flex items-center space-x-2">
                      <IconHistory className="w-5 h-5 text-cyan-400" />
                      <span>Knowledge Overwrite & Rule Change Audit Log</span>
                    </h2>
                    <p className="text-xs text-cyan-200/80 mt-0.5">
                      Visual audit timeline showing how newly uploaded files and voice transcripts supersede older rules.
                    </p>
                  </div>

                  <div className="space-y-4">
                    {auditLogs.map((log) => (
                      <div key={log.id} className="p-4 rounded-2xl bg-slate-950/70 border border-white/10 space-y-2">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-bold text-amber-300">{log.title}</span>
                          <span className="font-mono text-slate-400 text-[10px]">{log.timestamp}</span>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-1">
                          <div className="p-2.5 rounded-xl bg-rose-950/30 border border-rose-500/30 text-rose-200">
                            <span className="text-[10px] font-bold uppercase block text-rose-400">Overwritten Legacy Source</span>
                            {log.overwrittenFile}
                          </div>
                          <div className="p-2.5 rounded-xl bg-emerald-950/30 border border-emerald-500/30 text-emerald-200">
                            <span className="text-[10px] font-bold uppercase block text-emerald-400">New Active Approved Source</span>
                            {log.newFile}
                          </div>
                        </div>
                        <div className="text-xs text-slate-300 pt-1">
                          <strong>Field Change:</strong> {log.fieldChanged}
                        </div>
                        <div className="text-xs text-slate-400 italic">
                          "{log.reason}"
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>

          </div>

          {}

          {/* MODALS AND OVERLAYS */}
          {selectedModalSource && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-2xl aqua-glass-panel p-6 space-y-4 max-h-[85vh] overflow-y-auto custom-scrollbar">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">{selectedModalSource.fileName}</h3>
                    <p className="text-xs text-cyan-300">{selectedModalSource.sourceType} • {selectedModalSource.date}</p>
                  </div>
                  <button onClick={() => setSelectedModalSource(null)} className="p-2 rounded-xl aqua-soft-btn text-white">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
                <pre className="p-4 rounded-xl bg-slate-950 border border-white/10 text-xs font-mono text-slate-200 whitespace-pre-wrap leading-relaxed">
                  {selectedModalSource.fullContent}
                </pre>
              </div>
            </div>
          )}

          {selectedEventModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-lg aqua-glass-panel p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div>
                    <span className="text-xs font-mono font-bold text-cyan-300">{selectedEventModal.date} @ {selectedEventModal.time}</span>
                    <h3 className="text-base font-bold text-white mt-1">{selectedEventModal.title}</h3>
                  </div>
                  <button onClick={() => setSelectedEventModal(null)} className="p-2 rounded-xl aqua-soft-btn text-white">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
                <div className="space-y-3 text-xs text-slate-200 leading-relaxed">
                  <p><strong>Category:</strong> {selectedEventModal.category} ({selectedEventModal.priority} Priority)</p>
                  <p><strong>Description:</strong> {selectedEventModal.description}</p>
                  <p><strong>Linked Memory Source:</strong> {selectedEventModal.linkedSource}</p>
                </div>
                <div className="pt-2 flex justify-end">
                  <button onClick={() => setSelectedEventModal(null)} className="px-4 py-2 rounded-xl aqua-glass-btn text-xs font-bold text-white">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAddEventModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-md aqua-glass-panel p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base font-bold text-white">Schedule Calendar Event</h3>
                  <button onClick={() => setShowAddEventModal(false)} className="p-2 rounded-xl aqua-soft-btn text-white">
                    <IconX className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleCreateCustomEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Event Title</label>
                    <input name="eventTitle" required type="text" placeholder="e.g. Bus Fleet Deposit Lock" className="w-full bg-slate-950 border border-white/20 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Date</label>
                      <input name="eventDate" required type="date" defaultValue="2026-10-18" className="w-full bg-slate-950 border border-white/20 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Time</label>
                      <input name="eventTime" required type="text" defaultValue="10:00 AM" className="w-full bg-slate-950 border border-white/20 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Category</label>
                      <select name="eventCategory" className="w-full bg-slate-950 border border-white/20 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                        <option value="Logistics">Logistics</option>
                        <option value="Partner">Partner</option>
                        <option value="Event">Event</option>
                        <option value="Governance">Governance</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Priority</label>
                      <select name="eventPriority" className="w-full bg-slate-950 border border-white/20 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400">
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                        <option value="Medium">Medium</option>
                        <option value="Normal">Normal</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Description</label>
                    <textarea name="eventDesc" required rows="3" placeholder="Provide operational details..." className="w-full bg-slate-950 border border-white/20 rounded-xl p-2.5 text-white focus:outline-none focus:border-cyan-400"></textarea>
                  </div>
                  <div className="pt-2 flex space-x-2">
                    <button type="submit" className="flex-1 py-2.5 rounded-xl aqua-glass-btn text-white font-bold">
                      Add Event
                    </button>
                    <button type="button" onClick={() => setShowAddEventModal(false)} className="px-4 py-2.5 rounded-xl aqua-soft-btn text-slate-300">
                      Cancel
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="mt-8 text-center text-xs text-cyan-200/60 py-4 border-t border-white/10">
            Cyber Volunteer Network • Institutional memory & conflict-resolution platform
          </footer>

        </div>
      );
    }

    function StructuredAnswerBox({ answer, onViewSource }) {
      const [showSources, setShowSources] = useState(false);

      if (!answer) return null;

      return (
        <div className="w-full space-y-4">
          
          {/* EXECUTIVE SUMMARY CALLOUT BOX */}
          <div className="p-5 rounded-2xl bg-gradient-to-r from-cyan-950/80 via-slate-950/90 to-blue-950/80 border border-cyan-400/40 shadow-xl space-y-2">
            <div className="flex items-center space-x-2 text-cyan-300 text-xs font-bold uppercase tracking-wider">
              <IconBrain className="w-4 h-4 text-cyan-400" />
              <span>💡 Executive Summary & Direct Answer</span>
            </div>
            <p className="text-xs sm:text-sm text-slate-100 font-medium leading-relaxed">
              {answer.executiveSummary}
            </p>
          </div>

          {/* STEP-BY-STEP ACTION PLAN */}
          {answer.actionPlan?.length > 0 && (
            <div className="p-5 rounded-2xl bg-slate-950/80 border border-white/10 space-y-3 shadow-lg">
              <h4 className="text-xs font-bold text-white uppercase tracking-wider flex items-center space-x-2">
                <IconCheck className="w-4 h-4 text-emerald-400" />
                <span>📋 Actionable Step-by-Step Instructions</span>
              </h4>
              <ul className="space-y-2">
                {answer.actionPlan.map((step, idx) => (
                  <li key={idx} className="flex items-start space-x-2.5 text-xs text-slate-200 leading-relaxed">
                    <span className="w-5 h-5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/40 flex items-center justify-center font-mono font-bold text-[10px] shrink-0 mt-0.5">
                      {idx + 1}
                    </span>
                    <span>{step}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* KEY PARAMETERS GRID */}
          {answer.keyGrid?.length > 0 && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {answer.keyGrid.map((item, idx) => (
                <div key={idx} className="p-3.5 rounded-xl bg-slate-950/70 border border-white/10 space-y-1">
                  <div className="flex items-center justify-between text-[10px] text-slate-400 font-bold uppercase">
                    <span>{item.label}</span>
                    <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold border ${
                      item.status === 'Critical' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' :
                      item.status === 'Warning' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' :
                      'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                    }`}>
                      {item.badge}
                    </span>
                  </div>
                  <div className="text-xs font-bold text-white">{item.value}</div>
                </div>
              ))}
            </div>
          )}

          {/* CONFLICT OVERWRITE WARNING */}
          {answer.conflict?.exists && (
            <div className="p-4 rounded-2xl bg-amber-950/60 border border-amber-400/60 space-y-2.5 shadow-lg">
              <div className="flex items-center space-x-2 text-amber-300">
                <IconAlert className="w-4 h-4 shrink-0" />
                <span className="text-xs font-bold uppercase tracking-wider">⚠️ Contradiction Resolved & Overwritten</span>
              </div>
              <p className="text-xs text-amber-200/90 leading-relaxed">{answer.conflict.summary}</p>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-1">
                <div className="p-2.5 rounded-xl bg-slate-950/80 border border-rose-500/40 text-rose-300">
                  <strong className="block text-[10px] uppercase text-rose-400">❌ Legacy Rule (Superseded)</strong>
                  {answer.conflict.oldRule}
                </div>
                <div className="p-2.5 rounded-xl bg-slate-950/80 border border-emerald-500/40 text-emerald-300">
                  <strong className="block text-[10px] uppercase text-emerald-400">✅ Active Approved SOP</strong>
                  {answer.conflict.newRule}
                </div>
              </div>

              <div className="p-2.5 rounded-xl bg-slate-950/90 border border-amber-500/30 text-[11px] text-amber-200">
                <strong>Why this was updated: </strong>
                <span>{answer.conflict.reason}</span>
              </div>
            </div>
          )}

          {/* COLLAPSIBLE EVIDENCE VERIFICATION */}
          {answer.sources?.length > 0 && (
            <div className="pt-1">
              <button
                onClick={() => setShowSources(!showSources)}
                className="w-full py-2 px-3 rounded-xl aqua-soft-btn text-xs text-cyan-300 font-bold flex items-center justify-between"
              >
                <span className="flex items-center space-x-2">
                  <IconShield className="w-4 h-4 text-emerald-400" />
                  <span>Collapsible Source Evidence & Verification Files ({answer.sources.length})</span>
                </span>
                <IconChevronDown className={`w-4 h-4 transition-transform ${showSources ? 'rotate-180' : ''}`} />
              </button>

              {showSources && (
                <div className="mt-2 space-y-2">
                  {answer.sources.map((src, idx) => (
                    <div key={idx} className="p-3 rounded-xl bg-slate-950/80 border border-white/10 text-xs flex justify-between items-center">
                      <div>
                        <div className="font-bold text-white">{src.fileName}</div>
                        <div className="text-[10px] text-slate-400">{src.sourceType} • {src.date}</div>
                        <p className="text-[11px] text-slate-300 mt-1 italic">"{src.excerpt}"</p>
                      </div>
                      <button
                        onClick={() => onViewSource(src)}
                        className="px-3 py-1.5 rounded-lg aqua-soft-btn text-[10px] text-cyan-300 font-bold shrink-0 ml-2"
                      >
                        Inspect Record
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
